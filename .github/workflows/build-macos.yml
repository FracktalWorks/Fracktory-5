name: Build macOS Installer

on:
  push:
    branches: [ mac_test ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ mac_test ]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        brew install cmake ninja create-dmg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install conan==1.60.2
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Add Conan remotes
      run: |
        conan remote add ultimaker-public https://ultimaker.jfrog.io/artifactory/api/conan/ultimaker-public-conan || true

    - name: Build application with Conan
      run: |
        conan install . --build=missing \
          -s compiler=apple-clang \
          -s compiler.version=14.0 \
          -s compiler.libcxx=libc++ \
          -s build_type=Release
        conan build .

    - name: Create macOS installer
      run: |
        VERSION="5.5.0"  # Replace with your version
        python packaging/macOS/build_macos.py \
          --source_path . \
          --dist_path build \
          --cura_conan_version ${VERSION} \
          --filename "Fracktory-${VERSION}-macOS" \
          --app_name "Fracktory" \
          --build_dmg

    - name: Upload macOS installer
      uses: actions/upload-artifact@v4
      with:
        name: Fracktory-macOS-Installer
        path: build/*.dmg
        retention-days: 30
